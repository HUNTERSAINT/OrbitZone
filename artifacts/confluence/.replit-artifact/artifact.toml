kind = "web"
previewPath = "/"
title = "Orbit Zone"
description = "Orbit Zone connects adults in Lokoja, Nigeria, through verified profiles, discovery, matches, and chat."
version = "1.0.0"
id = "artifacts/confluence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21372

[services.development]
run = "pnpm --filter @workspace/confluence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/confluence", "run", "build" ]
serve = "static"
publicDir = "artifacts/confluence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21372"
BASE_PATH = "/"
